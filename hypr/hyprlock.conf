# Emergency fallback only: lock.sh runs this when the Quickshell lock
# (scripts/lock/qs) fails three times. Styled after that lock's default layout
# (meta defaults, 2026-10-28): current wallpaper, clock and date top left,
# greeting and an underline field bottom left, Adwaita Sans, Catppuccin colours.
# Positions are percentages of each monitor's viewport. +y is up. Sizes in px;
# label sizes match the Quickshell meta defaults (checked against --preview).

$font   = Adwaita Sans
$fg     = rgba(cdd6f4ff)
$peach  = rgba(fab387e6)
$shadow = rgba(11111bcc)

background {
    monitor =
    color = rgba(1b1923ff)
    # wallpaper.sh links the wallpaper picked in the selector (still for a
    # live one, else lock.png), the same picture the Quickshell lock draws.
    # lock.sh runs wallpaper.sh just before starting hyprlock.
    path = $HOME/.cache/hyprlock/wallpaper
    brightness = 0.85
    contrast = 1.0
    vibrancy = 0.0
    blur_passes = 0
}

# clock, top left (Quickshell: 130 px extralight at 5%, -9%)
label {
    monitor =
    text = <span weight='ultralight'>$TIME</span>
    color = $fg
    font_size = 130
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 5%, -8.7%
    halign = left
    valign = top
}

# date under the clock: semibold, uppercase, tracked, peach
label {
    monitor =
    text = cmd[update:60000] printf "<span weight='semibold' letter_spacing='3072'>%s</span>" "$(date +'%A, %B %-d' | tr '[:lower:]' '[:upper:]')"
    color = $peach
    font_size = 15
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 5%, -19.6%
    halign = left
    valign = top
}

# greeting above the field
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); p=evening; [ "$h" -lt 18 ] && p=afternoon; [ "$h" -lt 12 ] && p=morning; echo "good $p, $USER"
    color = rgba(cdd6f4bf)
    font_size = 16
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 5%, 14.6%
    halign = left
    valign = bottom
}

# the underline the field sits on (Quickshell style = "line")
shape {
    monitor =
    size = 340, 2
    color = rgba(cdd6f440)
    rounding = 0
    border_size = 0

    position = 5%, 10%
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 340, 44
    position = 5%, 10%
    halign = left
    valign = bottom

    # no box: the shape above is the line; state shows in the line colours
    outline_thickness = 0
    rounding = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    check_color = rgba(f9e2afff)
    fail_color = rgba(f38ba8ff)
    capslock_color = rgba(fab387ff)
    font_color = $fg
    font_family = $font
    dots_size = 0.22
    dots_spacing = 0.9
    dots_center = false
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span foreground='##cdd6f480'>Password</span>
    fail_text = <span foreground='##f38ba8ff'>wrong password</span>
}
